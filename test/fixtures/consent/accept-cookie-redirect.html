<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Datenschutz</title></head><body>
<div id="sp_message_container_456" style="position:fixed;inset:0;background:white">
  <iframe id="sp_message_iframe_456" title="SP Consent Message" src="__CMP_ORIGIN__/wrapper/messaging" style="width:100%;height:100%"></iframe>
</div>
<p id="status"></p>
<script>
window.addEventListener('message', async event => {
  if (event.origin !== '__CMP_ORIGIN__' || event.source !== document.querySelector('iframe').contentWindow || event.data.action !== 'accept') return;
  document.body.dataset.steps = String(Number(document.body.dataset.steps || 0) + 1);
  document.getElementById('status').textContent = 'Zustimmung erteilt.';
  try { document.querySelector('iframe').contentWindow.document.body; }
  catch (error) { document.body.dataset.crossOrigin = String(error.name === 'SecurityError'); }
  await fetch('/consent/decision', {
    method: 'POST', credentials: 'same-origin', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ trusted: event.data.trusted, crossOrigin: document.body.dataset.crossOrigin, steps: Number(document.body.dataset.steps) })
  });
  if (!document.cookie.includes('consent=accepted') || !document.cookie.includes('consent_date=recorded')) return;
  location.href = '/editorial';
});
</script></body></html>
