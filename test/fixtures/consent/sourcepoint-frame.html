<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Datenschutz</title></head><body>
<div class="message type-modal" role="dialog" aria-modal="true" aria-label="Privatsphäre-Einstellungen">
  <h1>Ihre Privatsphäre ist uns wichtig</h1><p>Wir und unsere Partner verwenden Cookies und ähnliche Technologien, um personenbezogene Daten auf Ihrem Gerät zu speichern, Werbung zu personalisieren und die Nutzung unseres Angebots zu messen. Sie können Ihre Einwilligung jederzeit ändern.</p>
  <button class="message-component message-button" title="Akzeptieren und weiter" onclick="parent.postMessage({action:'accept',trusted:event.isTrusted},'*')">Akzeptieren und weiter</button>
  <button class="message-component message-button" title="Alle ablehnen" onclick="parent.postMessage({action:'reject',trusted:event.isTrusted},'*')">Alle ablehnen</button>
  <button class="message-component message-button">Einstellungen</button>
</div></body></html>
